# LeKiwi 6-DOF机械臂 ACT策略配置
# 用于训练抓取纸团任务（底盘静止，只控制机械臂）

# 策略类型
policy:
  type: act
  
  # 观测和动作特征（6-DOF机械臂，不含底盘）
  input_features:
    observation.images.front:
      type: image
      shape: [3, 480, 640]
    observation.state:
      type: state
      shape: [6]  # 只包含机械臂6关节
  
  output_features:
    action:
      type: state
      shape: [6]  # 只输出机械臂6关节
  
  # 动作分块配置
  n_action_steps: 8        # 预测未来8步动作
  chunk_size: 8            # 动作序列长度
  n_obs_steps: 1           # 观测历史步数
  
  # Transformer配置
  dim_model: 512           # 模型维度
  n_heads: 8               # 注意力头数
  n_encoder_layers: 4      # 编码器层数
  n_decoder_layers: 7      # 解码器层数
  
  # CVAE配置
  use_vae: true            # 使用变分自编码器
  latent_dim: 32           # 隐变量维度
  kl_weight: 10.0          # KL散度权重
  
  # 图像编码器
  vision_backbone: resnet18
  pretrained_backbone: true
  
  # 时序集成
  temporal_ensemble_coeff: 0.01

# 训练配置
training:
  lr: 1e-5
  num_epochs: 3000
  batch_size: 16
  num_workers: 4
  save_freq: 1000
  eval_freq: 1000
  
  # 图像增强
  image_transforms:
    enable: true
    random_crop: true
    color_jitter: true

# 数据集配置
dataset:
  repo_id: "your_username/lekiwi_grasp_paper_ball"
  fps: 30
  
  # 视频编码
  use_videos: true
  image_writer_threads: 4
